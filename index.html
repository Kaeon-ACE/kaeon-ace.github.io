<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Smooth Locomotion – BabylonJS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    #overlay {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #fff; font-family: system-ui, sans-serif;
      font-size: 13px; padding: 8px 16px; border-radius: 20px;
      pointer-events: none; white-space: nowrap; letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="overlay">Click "Enter VR" → left thumbstick to fly · right thumbstick to turn</div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
  (function () {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { adaptToDeviceRatio: true });

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.08, 0.08, 0.14, 1);

      // ── Camera (fallback for non-VR desktop preview) ──────────────────────
      const camera = new BABYLON.UniversalCamera(
        "cam", new BABYLON.Vector3(0, 1.6, -4), scene
      );
      camera.minZ = 0.01;
      camera.attachControl(canvas, true);
      camera.speed = 0.15;

      // ── Lighting ──────────────────────────────────────────────────────────
      const hemi = new BABYLON.HemisphericLight(
        "hemi", new BABYLON.Vector3(0, 1, 0), scene
      );
      hemi.intensity = 0.6;
      hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

      const dir = new BABYLON.DirectionalLight(
        "dir", new BABYLON.Vector3(-1, -2, -1), scene
      );
      dir.intensity = 0.8;
      dir.position = new BABYLON.Vector3(5, 8, 5);

      // Soft shadow
      const shadowGen = new BABYLON.ShadowGenerator(512, dir);
      shadowGen.useBlurExponentialShadowMap = true;

      // ── Floor ────────────────────────────────────────────────────────────
      const floor = BABYLON.MeshBuilder.CreateGround(
        "floor", { width: 40, height: 40, subdivisions: 2 }, scene
      );
      const floorMat = new BABYLON.StandardMaterial("floorMat", scene);
      floorMat.diffuseColor = new BABYLON.Color3(0.18, 0.18, 0.25);
      floorMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.1);
      floor.material = floorMat;
      floor.receiveShadows = true;

      // Grid lines on floor (cheap, using line system)
      const gridLines = [];
      for (let i = -20; i <= 20; i += 2) {
        gridLines.push([new BABYLON.Vector3(i, 0.001, -20), new BABYLON.Vector3(i, 0.001, 20)]);
        gridLines.push([new BABYLON.Vector3(-20, 0.001, i), new BABYLON.Vector3(20, 0.001, i)]);
      }
      const grid = BABYLON.MeshBuilder.CreateLineSystem("grid", { lines: gridLines }, scene);
      grid.color = new BABYLON.Color3(0.28, 0.28, 0.42);
      grid.alpha = 0.5;

      // ── Stationary reference cube ─────────────────────────────────────────
      const cube = BABYLON.MeshBuilder.CreateBox("cube", { size: 1 }, scene);
      cube.position.set(0, 0.5, 0);
      const cubeMat = new BABYLON.StandardMaterial("cubeMat", scene);
      cubeMat.diffuseColor  = new BABYLON.Color3(0.2, 0.55, 1.0);
      cubeMat.specularColor = new BABYLON.Color3(0.4, 0.6, 1.0);
      cubeMat.specularPower = 32;
      cube.material = cubeMat;
      shadowGen.addShadowCaster(cube);
      cube.receiveShadows = true;

      // Gently spin the cube so you can verify you're moving, not it
      scene.registerBeforeRender(() => {
        cube.rotation.y += 0.004;
      });

      // ── Scatter some landmark objects ─────────────────────────────────────
      const colors = [
        new BABYLON.Color3(1.0, 0.35, 0.35),
        new BABYLON.Color3(0.35, 1.0, 0.55),
        new BABYLON.Color3(1.0, 0.85, 0.2),
        new BABYLON.Color3(0.85, 0.35, 1.0),
        new BABYLON.Color3(0.2, 0.9, 0.9),
      ];
      const positions = [
        [5, 0, 5], [-6, 0, 4], [4, 0, -7], [-5, 0, -5], [8, 0, -2],
        [-9, 0, 0], [0, 0, 9], [3, 0, 12], [-4, 0, 11], [10, 0, 8],
      ];
      positions.forEach(([x, , z], i) => {
        const h = 0.5 + Math.random() * 1.5;
        const m = BABYLON.MeshBuilder.CreateBox(`box${i}`, { width: 0.6, height: h, depth: 0.6 }, scene);
        m.position.set(x, h / 2, z);
        const mat = new BABYLON.StandardMaterial(`mat${i}`, scene);
        mat.diffuseColor = colors[i % colors.length];
        m.material = mat;
        shadowGen.addShadowCaster(m);
        m.receiveShadows = true;
      });

      // ── Skybox ────────────────────────────────────────────────────────────
      const sky = BABYLON.MeshBuilder.CreateBox("sky", { size: 200 }, scene);
      const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
      skyMat.backFaceCulling = false;
      skyMat.disableLighting  = true;
      skyMat.emissiveColor    = new BABYLON.Color3(0.04, 0.04, 0.1);
      sky.material = skyMat;
      sky.isPickable = false;

      // ── WebXR ─────────────────────────────────────────────────────────────
      // Locomotion state
      const loco = {
        moveSpeed:  3.5,   // m/s
        turnSpeed:  .000001,    // deg/s
        deadzone:   0.18,
        smoothing:  0.12,  // lower = smoother (exponential lerp factor)
        velX: 0, velZ: 0,  // smoothed velocity
      };

      scene.createDefaultXRExperienceAsync({
        floorMeshes: [floor],
        optionalFeatures: true,
        disableTeleportation: true,   // we handle locomotion ourselves
      }).then(xr => {

        if (!xr || !xr.baseExperience) {
          console.warn("WebXR not available");
          return;
        }

        const xrHelper = xr.baseExperience;

        // ── Per-frame locomotion ───────────────────────────────────────────
        scene.registerBeforeRender(() => {
          if (xrHelper.state !== BABYLON.WebXRState.IN_XR) return;

          const fm = xr.input?.xrCamera;
          if (!fm) return;

          let rawMoveX = 0, rawMoveZ = 0, rawTurn = 0;
          let moveController = null;

          // Identify left (move) and right (turn) controllers by handedness
          for (const ctrl of (xr.input?.controllers ?? [])) {
            const hand = ctrl.inputSource?.handedness;
            const gp   = ctrl.inputSource?.gamepad;
            if (!gp) continue;

            const axes = gp.axes;  // [touchpad-x, touchpad-y, thumb-x, thumb-y]
            // Quest 3 thumbstick is axes[2] & axes[3]
            const tx = axes[2] ?? axes[0] ?? 0;
            const ty = axes[3] ?? axes[1] ?? 0;

            if (hand === "left") {
              rawMoveX = Math.abs(tx) > loco.deadzone ? tx : 0;
              rawMoveZ = Math.abs(ty) > loco.deadzone ? ty : 0;
              moveController = ctrl;
            } else if (hand === "right") {
              rawTurn  = Math.abs(tx) > loco.deadzone ? tx : 0;
            }
          }

          const dt = engine.getDeltaTime() / 1000; // seconds

          // ── Smooth the movement values (exponential lerp) ─────────────────
          const alpha = 1 - Math.pow(1 - loco.smoothing, dt * 60);
          loco.velX += (rawMoveX - loco.velX) * alpha;
          loco.velZ += (rawMoveZ - loco.velZ) * alpha;

          // ── Direction: project controller orientation onto the XZ plane ───
          // We use the camera's forward/right so you look where you lean
          const camForward = xrHelper.camera.getForwardRay().direction;
          const flatFwd = new BABYLON.Vector3(camForward.x, 0, camForward.z).normalize();
          const flatRight = BABYLON.Vector3.Cross(BABYLON.Vector3.Up(), flatFwd).normalize();

          const moveVec = flatFwd.scale(-loco.velZ * loco.moveSpeed * dt)
            .add(flatRight.scale(loco.velX * loco.moveSpeed * dt));

          xrHelper.camera.position.addInPlace(moveVec);

          // ── Snap turn on right stick ──────────────────────────────────────
          // Continuous rotation (smooth) in this demo; set to snap if preferred
          if (Math.abs(rawTurn) > loco.deadzone) {
            xrHelper.camera.rotationQuaternion = BABYLON.Quaternion.RotationAxis(
              BABYLON.Vector3.Up(),
              BABYLON.Quaternion.FromRotationMatrix(
                xrHelper.camera.getWorldMatrix().getRotationMatrix()
              ).toEulerAngles().y + rawTurn * (loco.turnSpeed * BABYLON.Tools.ToRadians(1)) * dt
            ).multiply(xrHelper.camera.rotationQuaternion ?? BABYLON.Quaternion.Identity());

            // Simpler: just yaw the XR rig
            // xrHelper.camera.rotationQuaternion = BABYLON.Quaternion.RotationAxis(
            //   BABYLON.Vector3.Up(),
            //   rawTurn * loco.turnSpeed * BABYLON.Tools.ToRadians(1) * dt
            // ).multiplyInPlace(
            //   xrHelper.camera.rotationQuaternion ?? new BABYLON.Quaternion()
            // );
          }
        });

        // Disable built-in teleport pointer if it was enabled
        if (xr.teleportation) xr.teleportation.detach();

      }).catch(err => console.warn("XR init error:", err));

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  })();
  </script>
</body>
</html>
