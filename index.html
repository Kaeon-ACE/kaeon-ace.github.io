<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

	<head>

		<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

		<title>Babylon Template</title>

		<style>

			html, body {
				overflow: hidden;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}

			#game {
				width: 100%;
				height: 100%;
			}

		</style>

		<script src="https://cdn.babylonjs.com/babylon.js"></script>
		<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
		<script src="https://cdn.babylonjs.com/cannon.js"></script>

		<script src="https://cdn.jsdelivr.net/gh/Telos-Project/ACE/Code/ace.js"></script>
		<script src="https://cdn.jsdelivr.net/gh/Telos-Project/ACE/Code/aceOperators.js"></script>

	</head>

	<body>

		<div id="game"></div>

		<script>

			ace.run(
				"#game",
				{
					utilities: {
						myPhysics: {
							properties: {
								tags: ["physics", "telos-ace"],
								info: {
									direction: [0, -9.81, 0]
								}
							}
						},
						myCamera: {
							properties: {
								tags: ["camera", "telos-ace"],
								info: {
									position: [0, 25, -200],
									target: [0, 0, 0],
									type: "fly"
								}
							}
						},
						myLight: {
							properties: {
								tags: ["light", "telos-ace"],
								info: {
									position: [0, 1, 0],
									intensity: 1,
									type: "hemispheric"
								}
							}
						},
						mySphere: {
							properties: {
								tags: ["sphere", "telos-ace"],
								info: {
									position: [0, 50, 0],
									mass: 1,
									diameter: 25,
									segments: 32
								}
							}
						},
						myGround: {
							properties: {
								tags: ["ground", "telos-ace"],
								info: {
									mass: 0,
									width: 100,
									height: 100
								}
							}
						},
						myScript: {
							content: `

								let data = JSON.parse(arguments[0]);

								data.utilities.misc.properties.count++;

								if(data.utilities.misc.properties.count % 1000 == 0) {

									data.utilities[
										"ball_" + Math.floor(Math.random() * 10000)
									] = {
										properties: {
											tags: ["sphere", "telos-ace"],
											info: {
												position: [Math.random() * 2 - 1, 100, Math.random() * 2 - 1],
												mass: .1,
												diameter: 5,
												segments: 16
											}
										}
									}
								}

								return JSON.stringify(data);
							`,
							properties: {
								tags: ["script", "telos-ace"],
								info: {
									language: "JS",
									mode: "JSON"
								}
							}
						},
						misc: {
							properties: {
								time: 0
							}
						}
					}
				}
			);

		</script>

	</body>

</html>
